<!DOCTYPE html>
<html lang="en">
<head>  
  <link rel="icon" href="stone.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>about</title>
  <style>

    /* ========================================= GENERAL ========================================= */

    :root {
      --bg-color: rgb(242, 242, 238);
      --text-color: #2a2a2a;
      --font-main: 'Menlo', Courier, monospace;
      --font-bold: 'Menlo Bold', Courier, monospace;
      --header-height: 4em;
      --title-size: 19pt;
      --subtitle-size: 14pt;
      --text-size: 12pt;
      --margin: 4vw;
      --spacing: 2vw;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%;
      height: 100dvh;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-main);
      font-size: var(--text-size);
      line-height: 1.4;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      max-width: 100vw;
    }


    .site-header {
      position: fixed; top: 0; left: 0; width: 100%;
      height: var(--header-height);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 var(--margin); z-index: 100;
    }

    .header-left { display: flex; align-items: center; gap: var(--spacing); }
    .social-link {
      color: var(--text-color); text-decoration: none;
      font-size: var(--subtitle-size); letter-spacing: 1px;
      transition: opacity 0.3s;
    }
    .social-link:hover { text-decoration: underline; cursor: pointer; }



    .layout-container {
      display: grid; grid-template-columns: 1fr 38vw;
      height: 100dvh; width: 100%;
      overflow-x: hidden;
    }
    .column::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }




    /* ========================================= RIGHT COLUMN ========================================= */

    .col-right { padding: var(--margin); padding-left: var(--margin); height: 80vh; position: relative; top: 10em; display: flex; }
    .info-section { margin-bottom: var(--spacing); padding-right: 15vw;  }



    /* ========================================= LEFT COLUMN ========================================= */


    .col-left {
      overflow-y: auto;
      padding: 0 !important;
      width: 100%;
      min-width: 100%;
      height: 100vh;
      overflow: hidden;
      justify-content: space-evenly; align-items: center;
    }


    .image-column { display: flex; flex-direction: column; gap: 0.5em; position: relative; top: var(--spacing); right: var(--spacing); min-width: 0; height: 100%; width: fit-content; justify-content: space-evenly; align-items: center;}

    .project-main-image {
      width: 100%;
      max-width: none;
      min-width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-self: space-between;
      cursor: pointer;
      overflow: hidden;
      scale: 1;
      transition: scale 0.1s ease-in-out;
    }

    .project-main-image img {
      width: 100%;
      height: auto;
      max-width: 100%;
      display: block;
    }

    /* ========================================= MOBILE ========================================= */

    @media (max-width: 800px) {
        :root {
            --margin: 4em;
        }


        .layout-container {
          grid-template-columns: 1fr;
        }
      
        .col-left  { order: 1; height: 25vh;}
        .col-right { order: 2; top: 0; }
        .info-section { padding-right: 0;}

        .project-main-image {width: 30%; min-width: 30%; padding-top: var(--margin)}

    }

  </style>


  <body>
  <header class="site-header">
    <div class="header-left">
      <div onclick="window.open('home.html', '_self')" class="social-link" target="_self">< home</div>
    </div>
  </header>

  <div class="layout-container">

    <aside class="column col-right">
      <div class="info-section">
        <div style="font-size: var(--title-size); font-family: var(--font); font-weight: 400; margin-bottom: 40px; margin-top: -6px; color: var(--text-color);">
          
          contact me at:

        </div>
        <p style="font-size: var(--title-size); font-family: var(--font); font-weight: 400; margin-bottom: 40px; margin-top: -6px; color: var(--text-color);">

        kais.issadi@gmail.com

        <br>
        <br>

        @kaisissadi    
        
      </div>
    </aside>


    <aside class="column col-left">
          <div class="image-column">
            <div class="project-main-image">
              <img src="stone.png" alt="Installation">
            </div>
          </div>
    </aside>

  </div> 
</head>
